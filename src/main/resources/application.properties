# ========================================
# CONFIGURACIÓN GENERAL
# ========================================
spring.application.name=pos-sistema

# ========================================
# BASE DE DATOS (PostgreSQL LOCAL)
# ========================================
spring.datasource.url=jdbc:postgresql://localhost:5432/pos_db
spring.datasource.username=postgres
spring.datasource.password=Ipoduri5s
spring.datasource.driver-class-name=org.postgresql.Driver

# ========================================
# JPA / HIBERNATE
# ========================================
# IMPORTANTE: Con Flyway, NO usamos ddl-auto=update
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ========================================
# FLYWAY (Migracione de BD)
# ========================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false
# ========================================
# SERVIDOR
# ========================================
server.port=8080

